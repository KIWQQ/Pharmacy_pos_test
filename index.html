<style>
:root{--color-brand:#0EB27C;--color-brand-soft:#DFF9F9;--color-primary:#047857;--color-primary-hover:#065F46;--color-danger:#DC2626;--color-success:#15803D;--color-warning:#EE950A;--color-info:#2563EB;--color-background:#EAF8FC;--color-surface:#FFFFFF;--color-text-primary:#171717;--color-text-secondary:#667085;--color-border:#D0D5DD;--color-disabled:#98A2B3;--space-8:8px;--space-16:16px;--space-24:24px;--space-32:32px}
*{box-sizing:border-box}
body{margin:0;background:var(--color-background);color:var(--color-text-primary);font:400 16px/24px Inter,"Noto Sans Thai"}
.shell{display:flex;min-height:100vh}
.sidebar{width:240px;flex:0 0 240px;min-height:100vh;background:var(--color-surface);border-right:1px solid var(--color-border)}
.brand-header{min-height:80px;padding:24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--color-border)}
.brand-logo-icon{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--color-brand-soft);color:var(--color-brand)}
.brand-logo-icon svg{width:20px;height:20px}
.brand-text strong{display:block;font-size:16px;line-height:20px;font-weight:700}.brand-text p{margin:0;color:var(--color-text-secondary);font-size:12px;line-height:16px}
.nav-group{padding:8px 0}
.nav-label{padding:8px 24px;color:var(--color-text-secondary);font-size:12px;line-height:16px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:16px;min-height:52px;padding:16px 24px;color:var(--color-text-secondary);text-decoration:none;font-size:14px;line-height:20px;font-weight:500;border-right:4px solid transparent}
.nav-item svg{width:18px;height:18px;stroke-width:2;flex:none}.nav-item:hover{background:var(--color-background);color:var(--color-text-primary)}
.nav-item.active{background:var(--color-brand-soft);border-right-color:var(--color-brand);color:var(--color-brand);font-weight:600}
.main{flex:1;min-width:0;padding:32px}.content{width:100%;max-width:1440px;margin:auto}
.page-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px;min-height:64px}
.page-header h1{font-size:32px;line-height:40px;font-weight:700;margin:0}
.page-header p{font-size:14px;line-height:20px;color:var(--color-text-secondary);margin:8px 0 0}
.header-meta{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;padding:8px 16px;background:var(--color-brand-soft);color:var(--color-primary);border-radius:10px;font-size:12px;line-height:16px}
.action{min-height:44px;padding:8px 16px;border:1px solid var(--color-primary);border-radius:10px;background:var(--color-primary);color:var(--color-surface);font:600 14px/20px Inter,"Noto Sans Thai";cursor:pointer}
.action:hover{background:var(--color-primary-hover)}
.action.secondary{background:var(--color-surface);border-color:var(--color-border);color:var(--color-text-primary)}
.action:focus-visible,.nav-item:focus-visible{outline:2px solid var(--color-info);outline-offset:2px}
#page{display:block;width:100%;height:calc(100vh - 176px);height:calc(100dvh - 176px);min-height:480px;border:0;background:transparent}
@media(max-width:760px){.sidebar{display:none}.main{padding:16px}.page-header{align-items:flex-start;flex-wrap:wrap}#page{height:calc(100dvh - 176px)}}

/* Responsive shell; original navigation and route handlers are retained. */
@media(max-width:760px){
.shell{flex-direction:column;min-height:0;height:100dvh}
.sidebar{display:block;width:100%;flex:0 0 auto;min-height:0;border-right:0;border-bottom:1px solid var(--color-border);background:var(--color-surface)}
.sidebar .brand-header{display:none}
.sidebar .nav-grow{display:flex;overflow-x:auto;white-space:nowrap;padding:8px;gap:8px;-webkit-overflow-scrolling:touch}
.sidebar .nav-group{display:contents}.sidebar .nav-label{display:none}
.sidebar .nav-item{flex:none;min-height:44px;padding:8px 16px;gap:8px;border:0;border-radius:10px;font-size:12px}
.sidebar .nav-item.active{background:var(--color-brand-soft);color:var(--color-brand)}
.main{padding:16px;display:flex;flex:1;min-height:0;overflow:hidden}
.content{display:flex;flex-direction:column;min-height:0;min-width:0}
.page-header{flex:none;min-height:0;gap:16px;margin-bottom:16px}
.page-header h1{font-size:24px;line-height:32px}.page-header p{font-size:12px;line-height:18px}
.header-meta{width:100%;flex-wrap:wrap;gap:8px}.header-meta .action{width:100%}
.pill{max-width:100%;overflow-wrap:anywhere;padding:8px;font-size:11px}
#page{flex:1;min-height:0;height:0;width:100%}
}

.mobile-bar,.menu-backdrop,.menu-close{display:none}
@media(max-width:760px){
.mobile-bar{display:flex;align-items:center;gap:12px;flex:none;padding:8px 16px;background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.mobile-bar strong{font-size:16px}.menu-toggle,.menu-close{width:44px;min-height:44px;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface);color:var(--color-primary);font-size:24px;cursor:pointer}
.shell>.sidebar{display:none;position:fixed;inset:0 auto 0 0;z-index:30;width:min(280px,85vw);height:100dvh;min-height:0;overflow-y:auto;border-right:1px solid var(--color-border);border-bottom:0}
.shell.menu-open>.sidebar{display:block}
.sidebar .brand-header{display:flex;padding:16px;min-height:72px}.sidebar .brand-text{flex:1}.menu-close{display:block;flex:none}
.sidebar .nav-grow{display:block;overflow:visible;white-space:normal;padding:0}.sidebar .nav-group{display:block;padding:8px 0}.sidebar .nav-label{display:block}
.sidebar .nav-item{min-height:52px;padding:16px 24px;gap:16px;border-radius:0;border-right:4px solid transparent;font-size:14px}.sidebar .nav-item.active{border-right-color:var(--color-brand)}
.menu-open>.menu-backdrop{display:block;position:fixed;inset:0;z-index:29;border:0;background:color-mix(in srgb,var(--color-text-primary) 45%,transparent);padding:0;cursor:pointer}
.main{flex:1;min-height:0;align-items:stretch}.main>.content{flex:1;margin:0;min-height:0;width:100%;display:flex;flex-direction:column}
#page{display:block;flex:1 1 0;min-height:0;height:0;width:100%}
}
</style>
</head>

const routes={Dashboard:'dashboard',Medicines:'medicines',Refunds:'refunds','Stock Log':'stock-log'};
const labels={
 dashboard:['Dashboard','ภาพรวมยอดขาย สินค้ายอดนิยม และสต็อกยา'],
 medicines:['Medicines','จัดการข้อมูลยาและสถานะยา'],
 refunds:['Refund History','ดูประวัติและค้นหา refund ได้อย่างเป็นระเบียบ'],
 'stock-log':['Lot Stock Log','จำนวนบวกหมายถึงรับสินค้าเข้าสต็อก จำนวนลบหมายถึงจ่ายสินค้าออกจากสต็อก']
};
const frame=document.getElementById('page'), title=document.getElementById('page-title'), subtitle=document.getElementById('page-subtitle'), meta=document.getElementById('header-meta');
let current='',observer=null;
function decode(b64){return new TextDecoder('utf-8').decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)))}
function route(){const name=decodeURIComponent(location.hash.slice(1));return Object.hasOwn(PAGES,name)?name:'dashboard'}
function button(label,kind,handler){const b=document.createElement('button');b.type='button';b.className='action'+(kind==='secondary'?' secondary':'');b.textContent=label;b.onclick=handler;meta.append(b)}
function syncHeader(){
 const doc=frame.contentDocument;if(!doc)return;
 let [name,description]=labels[current];
 meta.replaceChildren();
 if(current==='dashboard'){
   const p=doc.getElementById('period');
   const badge=document.createElement('span');badge.className='pill';badge.textContent='ข้อมูลจำลอง';meta.append(badge);
   if(p){const range=document.createElement('span');range.className='pill';range.textContent=p.textContent;meta.append(range)}
 }
 if(current==='medicines'){
   const edit=doc.getElementById('view-edit-medicine');
   const editing=edit&&!edit.classList.contains('hidden');
   if(editing){
     name=doc.getElementById('edit-title')?.textContent||'Edit Medicine';
     description='จัดการข้อมูลยาและสถานะยา';
     button('Back to List','secondary',()=>doc.querySelector('#view-edit-medicine .page-header button')?.click());
   }else button('+ New Medicine','primary',()=>doc.querySelector('#view-medicines .page-header button')?.click());
 }
 if(current==='refunds'){
   const detail=doc.getElementById('viewDetails');
   if(detail?.classList.contains('active')){
     name='Refund Details';description='รายละเอียดการคืนเงิน (ดูข้อมูลอย่างเดียว ไม่สามารถแก้ไขได้)';
     button('Back to Refund History','secondary',()=>frame.contentWindow.showHistoryView());
   }
 }
 if(current==='stock-log'){
   button('Add Stock Lot','primary',()=>doc.getElementById('add')?.click());
 }
 title.textContent=name;subtitle.textContent=description;document.title=name+' — Pharmacy POS';
}
function show(name){
 if(current===name)return;current=name;
 document.querySelectorAll('.sidebar .nav-item').forEach(link=>{
   const selected=routes[link.textContent.replace(/\s+/g,' ').trim()]===name;
   link.classList.toggle('active',selected);
   if(selected)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');
 });
 title.textContent=labels[name][0];subtitle.textContent=labels[name][1];meta.replaceChildren();
 frame.srcdoc=decode(PAGES[name]);
}
document.querySelectorAll('.sidebar .nav-item').forEach(link=>{
 const destination=routes[link.textContent.replace(/\s+/g,' ').trim()];
 if(destination){link.href='#'+destination}
 else {link.href='#';link.addEventListener('click',e=>e.preventDefault())}
});
frame.addEventListener('load',()=>{
 observer?.disconnect();
 const doc=frame.contentDocument;if(!doc)return;
 syncHeader();
 observer=new MutationObserver(()=>syncHeader());
 observer.observe(doc.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','hidden']});
});

const menuShell=document.querySelector('.shell'),menuToggle=document.querySelector('.menu-toggle'),menuSidebar=document.getElementById('main-sidebar');
function setMenu(open){menuShell.classList.toggle('menu-open',open);menuToggle.setAttribute('aria-expanded',String(open));if(open){document.querySelector('.menu-close').focus()}else menuToggle.focus()}
menuToggle.addEventListener('click',()=>setMenu(!menuShell.classList.contains('menu-open')));
document.querySelector('.menu-close').addEventListener('click',()=>setMenu(false));
document.querySelector('.menu-backdrop').addEventListener('click',()=>setMenu(false));
menuSidebar.querySelectorAll('.nav-item').forEach(link=>link.addEventListener('click',()=>{if(matchMedia('(max-width:760px)').matches)setMenu(false)}));
document.addEventListener('keydown',event=>{if(!menuShell.classList.contains('menu-open'))return;if(event.key==='Escape'){event.preventDefault();setMenu(false)}if(event.key==='Tab'){const items=[...menuSidebar.querySelectorAll('a[href],button')],first=items[0],last=items.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
matchMedia('(max-width:760px)').addEventListener('change',()=>{menuShell.classList.remove('menu-open');menuToggle.setAttribute('aria-expanded','false')});

window.addEventListener('hashchange',()=>show(route()));
show(route());
</script>
</body>
</html>
